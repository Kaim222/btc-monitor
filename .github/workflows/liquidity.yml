name: BTC Liquidity Map

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: btc-liquidity
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run liquidity monitor
        run: python liquidity.py

      - name: Commit updated liquidity
        # Same fetch/reset/restore/retry pattern as commit_state.sh, with only our file.
        run: |
          set -eu
          if [ ! -f liquidity.json ]; then echo "run skipped; nothing to commit"; exit 0; fi
          git config user.name "btc-monitor"
          git config user.email "monitor@noreply"
          KEEP=$(mktemp -d)
          cp liquidity.json "$KEEP/"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$KEEP/liquidity.json" .
            git add liquidity.json
            if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "liquidity: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push -q origin HEAD:main; then echo "state pushed on try $i"; exit 0; fi
            echo "push raced another run, retrying ($i of 3)"
          done
          echo "state not pushed after 3 tries"
          exit 1
