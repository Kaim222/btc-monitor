name: MSTR Gap Monitor

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'   # every 5 minutes, 13:00-21:59 UTC on weekdays; the script itself keeps to 9:35-16:00 New York
    - cron: '15,45 * * * *'       # twice an hour around the clock: the BTC 50-day crossing check only
  workflow_dispatch:
    inputs:
      test:
        description: 'send one test push instead of checking the market'
        type: boolean
        default: false

concurrency:
  group: mstr-gap
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        # Bump yfinance deliberately after testing; pandas 3 is supported.
        run: pip install -q yfinance==1.7.0 pandas

      # One writer: while a session loop run (mstr_loop.yml) is in progress it does these checks every ~75 seconds,
      # so this run stands down. Fails open: if the API cannot be read, this run checks as before.
      - name: Skip while the session loop runs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          busy=no
          if [ "${{ inputs.test }}" != "true" ] && runs=$(gh run list --workflow mstr_loop.yml --status in_progress --limit 50 --json databaseId,status); then
            busy=$(echo "$runs" | python mstr_gap.py --loop-running)
          fi
          echo "session loop in progress: $busy"
          echo "skip=$busy" >> "$GITHUB_OUTPUT"

      - name: Run MSTR gap monitor
        if: steps.gate.outputs.skip != 'yes'
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
        run: python mstr_gap.py ${{ inputs.test && '--test' || '' }}

      # No rebase. Two runs that overlap were conflicting on mstr_state.json and failing the job (9/17).
      # State and the pine files are newest-wins, so take this run's copy over whatever is on main.
      # The ledger is append-only, so it is unioned with main rather than overwritten.
      # A lost race retries; if it still cannot push, the job still succeeds, because the alert has already been sent.
      - name: Commit updated state
        if: always() && steps.gate.outputs.skip != 'yes'
        run: |
          set -u
          git config user.name  "btc-monitor"
          git config user.email "monitor@noreply"
          FILES="mstr_state.json mstr_ledger.json mstr_gap_lag.pine mstr_projected.pine mstx_projected.pine"
          KEEP=$(mktemp -d)
          # State and ledger always; a pine file only when this run changed it (sync_pine). Copying an untouched pine file over main
          # reverted a pine push that landed while a run was going (10/1, the loop's first commit after 4ee47b21).
          for f in $FILES; do
            case "$f" in *.pine) git diff --quiet HEAD -- "$f" && continue;; esac
            [ -f "$f" ] && cp "$f" "$KEEP/$f"
          done
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $FILES; do [ -f "$KEEP/$f" ] && cp "$KEEP/$f" "$f"; done
            if [ -f "$KEEP/mstr_ledger.json" ]; then
              git show origin/main:mstr_ledger.json > /tmp/remote_ledger.json 2>/dev/null || echo "[]" > /tmp/remote_ledger.json
              python merge_ledger.py /tmp/remote_ledger.json $KEEP/mstr_ledger.json mstr_ledger.json
            fi
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "mstr state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push -q origin HEAD:main; then echo "state pushed on try $i"; exit 0; fi
            echo "push raced another run, retrying ($i of 3)"
          done
          echo "state not pushed after 3 tries; the alert itself already went out"
          exit 0

      - name: Notify first failure in a streak
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          previous=$(gh run list --workflow mstr_gap.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$previous" = "success" ]; then
            curl --fail-with-body --silent --show-error --max-time 30 \
              --data-urlencode "token=$PUSHOVER_TOKEN" \
              --data-urlencode "user=$PUSHOVER_USER" \
              --data-urlencode "title=Monitor down" \
              --data-urlencode "message=Monitor run failed: $RUN_URL" \
              https://api.pushover.net/1/messages.json
          fi
