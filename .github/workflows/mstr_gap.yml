name: MSTR Gap Monitor

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'   # every 5 minutes, 13:00-21:59 UTC on weekdays; the script itself keeps to 9:35-16:00 New York
    - cron: '15,45 * * * *'       # twice an hour around the clock: the BTC 50-day crossing check only
  workflow_dispatch:
    inputs:
      test:
        description: 'send one test push instead of checking the market'
        type: boolean
        default: false

concurrency:
  group: mstr-gap
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        # Bump yfinance deliberately after testing; pandas 3 is supported.
        run: pip install -q yfinance==1.7.0 pandas

      # One writer: while a session loop run (mstr_loop.yml) is in progress it does these checks every ~75 seconds,
      # so this run stands down. Fails open: if the API cannot be read, this run checks as before.
      - name: Skip while the session loop runs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          busy=no
          if [ "${{ inputs.test }}" != "true" ] && runs=$(gh run list --workflow mstr_loop.yml --status in_progress --limit 50 --json databaseId,status,displayTitle); then
            busy=$(echo "$runs" | python mstr_gap.py --loop-running)
          fi
          echo "session loop in progress: $busy"
          echo "skip=$busy" >> "$GITHUB_OUTPUT"

      - name: Run MSTR gap monitor
        if: steps.gate.outputs.skip != 'yes'
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
        run: |
          # Start from main's newest state: a cooldown pushed after this run's checkout must not be repeated (10/1 review).
          git fetch -q origin main && git reset -q --hard origin/main || echo "could not refresh to origin/main; checking the checkout"
          python mstr_gap.py ${{ inputs.test && '--test' || '' }}

      # The session loop's commit script: state is newest-wins, the ledger is unioned with main, and the pine files take only
      # sync_pine's edits as a patch, so a pine code push that lands mid-run survives. Read into memory first, because its
      # own reset can rewrite the file while bash reads it. A push that cannot land is not fatal: the alert already went out.
      - name: Commit updated state
        if: always() && steps.gate.outputs.skip != 'yes'
        run: |
          script=$(cat .github/workflows/commit_state.sh)
          bash -c "$script" || echo "state not pushed after 3 tries; the alert itself already went out"

      - name: Notify first failure in a streak
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          previous=$(gh run list --workflow mstr_gap.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$previous" = "success" ]; then
            curl --fail-with-body --silent --show-error --max-time 30 \
              --data-urlencode "token=$PUSHOVER_TOKEN" \
              --data-urlencode "user=$PUSHOVER_USER" \
              --data-urlencode "title=Monitor down" \
              --data-urlencode "message=Monitor run failed: $RUN_URL" \
              https://api.pushover.net/1/messages.json
          fi
